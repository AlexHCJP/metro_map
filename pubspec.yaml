name: metro_map
description: "Draws linked items as a metro map: parallel branches share a row, merges are visible, and everything flows to the finish. Vertical or horizontal."
version: 0.1.0

homepage: https://github.com/AlexHCJP/metro_map
repository: https://github.com/AlexHCJP/metro_map
issue_tracker: https://github.com/AlexHCJP/metro_map/issues

screenshots:
  - description: A launch plan split into three branches that meet at the code review.
    path: screenshots/metro.png

topics:
  - graph
  - visualization
  - diagram
  - roadmap

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
